/* ══════════════════════════════════════════════════════════
   8. 프리뷰 — 영상 위에서 자막을 보며 타이밍과 문장을 잡는다
   ══════════════════════════════════════════════════════════ */
function Preview({ cues, apply, mark, lim, fps, meta }) {
  const RATE = RATES[fps] || RATES['23.976'];
  const FPS = RATE.real, FR = 1 / FPS;
  const vid = useRef(null), aud = useRef(null), wf = useRef(null), strip = useRef(null), raf = useRef(0);
  const [vurl, setVurl] = useState(null), [aurl, setAurl] = useState(null);
  const [vname, setVname] = useState(''), [aname, setAname] = useState('');
  const [vfail, setVfail] = useState('');
  const [snd, setSnd] = useState('v');
  const [t, setT] = useState(0), [playing, setPlaying] = useState(false);
  const [sel, setSel] = useState(0), [edit, setEdit] = useState(false);
  const [env, setEnv] = useState(null), [sp, setSp] = useState([]), [ana, setAna] = useState('');
  const [span, setSpan] = useState(0), [c0, setC0] = useState(0);
  const [filt, setFilt] = useState('all');
  const [drag, setDrag] = useState(null);
  const tRef = useRef(0), stopAt = useRef(null);
  useEffect(() => { tRef.current = t; }, [t]);

  const dur = useMemo(() => {
    const last = cues.length ? cues[cues.length-1].out : 0;
    return Math.max(last + 5, 1);
  }, [cues]);
  useEffect(() => { if (!span) setSpan(dur); }, [dur]);

  const view = span || dur;
  const t2f = (x) => (x - c0) / view;
  const clampV = (s, c) => { const sp2 = Math.min(dur, Math.max(1.5, s));
    return [sp2, Math.min(dur - sp2, Math.max(0, c))]; };
  const setZoom = (ns, anchor) => {
    const a = anchor == null ? t : anchor;
    const f = Math.min(1, Math.max(0, (a - c0) / view));
    const [s2, c2] = clampV(ns, a - f * Math.min(dur, Math.max(1.5, ns)));
    setSpan(s2); setC0(c2);
  };

  /* 오디오에서 파형과 발화 구간을 뽑는다 (센터 채널 파일이면 훨씬 정확하다) */
  const analyse = async (file) => {
    setAna('소리를 읽는 중…');
    try {
      const buf = await file.arrayBuffer();
      const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const ctx = new OC(1, 1, 8000);
      const ab = await ctx.decodeAudioData(buf);
      const ch = ab.getChannelData(0), sr = ab.sampleRate;
      const hop = Math.round(sr * 0.05), n = Math.floor(ch.length / hop);
      const e = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        let s = 0; const a = i * hop;
        for (let k = 0; k < hop; k++) { const v = ch[a+k]; s += v*v; }
        e[i] = Math.sqrt(s / hop);
      }
      const db = Array.from(e, v => 20 * Math.log10(v + 1e-9));
      const sorted = [...db].sort((a,b) => a-b);
      const floor = sorted[Math.floor(sorted.length * 0.2)] || -60;
      const thr = floor + 9;
      const segs = []; let st = -1;
      for (let i = 0; i < n; i++) {
        if (db[i] > thr) { if (st < 0) st = i; }
        else if (st >= 0) { if ((i - st) * 0.05 >= 0.10) segs.push([st*0.05, i*0.05]); st = -1; }
      }
      if (st >= 0) segs.push([st*0.05, n*0.05]);
      const mg = [];
      for (const [a,b] of segs) {
        if (mg.length && a - mg[mg.length-1][1] <= 0.20) mg[mg.length-1][1] = b;
        else mg.push([a,b]);
      }
      setEnv(e); setSp(mg);
      setAna(`발화 ${mg.length}구간 · ${(ab.duration/60).toFixed(1)}분`);
    } catch (err) { setEnv(null); setSp([]); setAna('소리를 읽지 못했습니다 — ' + err.message); }
  };

  const openVid = (f) => { if (!f) return;
    setVurl(u => { if (u) URL.revokeObjectURL(u); return URL.createObjectURL(f); });
    setVname(f.name); setVfail(''); setSnd('v');
    if (!aurl) analyse(f);
  };
  const openAud = (f) => { if (!f) return;
    setAurl(u => { if (u) URL.revokeObjectURL(u); return URL.createObjectURL(f); });
    setAname(f.name); setSnd('a'); analyse(f);
  };

  /* 재생 — 영상이 있으면 영상이 시계다 */
  useEffect(() => {
    const v = vid.current, a = aud.current;
    if (v) v.muted = snd !== 'v';
    if (a) a.muted = snd !== 'a';
  }, [snd, vurl, aurl]);

  const seek = (x) => {
    const nt = Math.min(dur, Math.max(0, x));
    setT(nt);
    if (vid.current) vid.current.currentTime = nt;
    if (aud.current) aud.current.currentTime = nt;
  };
  const stop = () => { setPlaying(false);
    if (vid.current) vid.current.pause();
    if (aud.current) aud.current.pause(); };
  const start = () => { setPlaying(true);
    if (vid.current) vid.current.play().catch(()=>{});
    if (aud.current) aud.current.play().catch(()=>{}); };
  const toggle = () => { stopAt.current = null; playing ? stop() : start(); };
  /* 프레임 단위 조작은 재생을 멈추고 한다 — 흐르는 중에 밀면 자리가 어긋난다 */
  const nudgeTo = (x) => { stopAt.current = null; if (playing) stop(); seek(x); };
  /* 큐 하나로 건너뛰어 그 큐만 들어 본다 — 소리와 자막이 맞는지 빨리 훑는 용도 */
  const gotoCue = (k, play) => {
    if (k < 0 || k >= cues.length) return;
    const c = cues[k];
    setSel(k); setEdit(false);
    seek(Math.max(0, c.in - 0.15));
    if (play) { stopAt.current = c.out + 0.12; start(); }
    else stopAt.current = null;
  };
  useEffect(() => {
    if (!playing) return;
    let last = performance.now();
    const tick = (now) => {
      const v = vid.current;
      let x = (v && !v.paused) ? v.currentTime : tRef.current + (now - last) / 1000;
      last = now;
      x = Math.min(dur, x);
      tRef.current = x; setT(x);
      if (stopAt.current != null && x >= stopAt.current) { stopAt.current = null; stop(); return; }
      if (x >= dur) { stop(); return; }
      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [playing, dur]);

  /* 재생 위치를 따라 화면이 움직인다 */
  useEffect(() => {
    if (view >= dur) { if (c0) setC0(0); return; }
    if (t < c0 + view*0.12 || t > c0 + view*0.88) {
      const [, c2] = clampV(view, t - view/2); setC0(c2);
    }
  }, [t, view, dur]);

  /* 지금 나오는 자막을 편집 바가 따라간다 */
  const idxAt = (x) => cues.findIndex(c => x >= c.in && x <= c.out);
  useEffect(() => { if (!playing || edit) return;
    const k = idxAt(t); if (k >= 0 && k !== sel) setSel(k); }, [t, playing, edit]);

  const cur = cues[sel];
  const offOf = (c) => { if (!c || !sp.length) return null;
    const near = sp.map(([a]) => a).filter(a => Math.abs(a - c.in) < 2.5);
    return near.length ? near.reduce((p,q) => Math.abs(q-c.in) < Math.abs(p-c.in) ? q : p) - c.in : null; };
  const late = (c) => { const o = offOf(c); return o !== null && o < -0.5; };
  const lateCount = useMemo(() => cues.filter(late).length, [cues, sp]);

  /* 파형 · 발화 · 큐 그리기 */
  useEffect(() => {
    const cv = wf.current; if (!cv) return;
    const r = devicePixelRatio || 1, W = cv.clientWidth || 600, H = 52;
    cv.width = W*r; cv.height = H*r;
    const x = cv.getContext('2d'); x.setTransform(r,0,0,r,0,0); x.clearRect(0,0,W,H);
    const cs = getComputedStyle(document.documentElement);
    x.fillStyle = cs.getPropertyValue('--speechbg').trim() || 'rgba(56,189,248,.13)';
    for (const [a,b] of sp) { const x0 = t2f(a)*W, x1 = t2f(b)*W;
      if (x1 < 0 || x0 > W) continue; x.fillRect(x0, 0, Math.max(1, x1-x0), H); }
    if (env) {
      x.fillStyle = cs.getPropertyValue('--wavec').trim() || '#3d4d63';
      for (let px = 0; px < W; px++) {
        const ta = c0 + px/W*view, tb = c0 + (px+1)/W*view;
        const a = Math.max(0, Math.floor(ta/0.05)), b = Math.max(a+1, Math.floor(tb/0.05));
        let mx = 0; for (let k = a; k < b && k < env.length; k++) if (env[k] > mx) mx = env[k];
        const h = Math.max(1, Math.min(1, mx*4) * (H-6));
        x.fillRect(px, (H-h)/2, 1, h);
      }
    }
  }, [env, sp, view, c0, cues]);

  const s2 = (x) => s2t(x);
  const tcf = (x) => { const f = Math.floor((x % 1) * FPS);
    return s2t(x).slice(0,8) + ':' + String(f).padStart(2,'0'); };

  const shown = cues.map((c,i)=>[c,i]).filter(([c,i]) =>
    filt === 'all' || (filt === 'late' && late(c)) || (filt === 'edit' && c.edited));

  const setCue = (i, patch) => apply(prev => prev.map((c,k) => {
    if (k !== i) return c;
    const n = { ...c, ...patch, edited: true, by: 'pv' };
    if (patch.ko !== undefined && n.was0 === undefined) n.was0 = c.ko || '';
    if ((patch.in !== undefined || patch.out !== undefined) && n.tin0 === undefined) {
      n.tin0 = c.in; n.tout0 = c.out;
    }
    return n;
  }));

  const nudge = (w, d) => { const c = cues[sel], s = d*FR;
    if (!c) return;
    if (w === 'i') setCue(sel, { in: Math.min(c.out - FR, Math.max(0, c.in + s)) });
    else if (w === 'o') setCue(sel, { out: Math.max(c.in + FR, c.out + s) });
    else setCue(sel, { in: Math.max(0, c.in + s), out: c.out + s }); };
  const snap = () => { const c = cues[sel];
    if (!c) return;
    const near = sp.map(([a]) => a).filter(a => Math.abs(a - c.in) < 2.5);
    if (!near.length) return;
    const a = near.reduce((p,q) => Math.abs(q-c.in) < Math.abs(p-c.in) ? q : p);
    const len = c.out - c.in, ni = Math.max(0, a - 0.10);
    setCue(sel, { in: ni, out: ni + len }); };
  const revert = () => { const c = cues[sel];
    if (!c) return;
    apply(prev => prev.map((x,k) => { if (k !== sel) return x;
      const n = { ...x };
      if (n.was0 !== undefined) { n.ko = n.was0; delete n.was0; }
      if (n.tin0 !== undefined) { n.in = n.tin0; n.out = n.tout0; delete n.tin0; delete n.tout0; }
      delete n.by; n.edited = false; return n; })); };
  const nextIssue = () => { const nx = cues.findIndex((c,k) => k > sel && late(c));
    const k = nx >= 0 ? nx : cues.findIndex(late);
    if (k >= 0) { setSel(k); seek(Math.max(0, cues[k].in - 0.4)); } };

  /* 단축키 */
  useEffect(() => {
    const h = (e) => {
      if (/input|textarea/i.test(e.target.tagName) || edit) return;
      const K = e.key.toLowerCase();
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowLeft')  { e.preventDefault();
        e.shiftKey ? nudgeTo(t - FR) : gotoCue(sel - 1, true); }
      else if (e.key === 'ArrowRight') { e.preventDefault();
        e.shiftKey ? nudgeTo(t + FR) : gotoCue(sel + 1, true); }
      else if (K === 'i' && cur) { e.preventDefault(); stopAt.current = null; if (playing) stop();
        setCue(sel, { in: Math.min(t, cur.out - FR) }); }
      else if (K === 'o' && cur) { e.preventDefault(); stopAt.current = null; if (playing) stop();
        setCue(sel, { out: Math.max(t, cur.in + FR) }); }
      else if (K === 'n') { e.preventDefault(); nextIssue(); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); setZoom(view/1.6); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); setZoom(view*1.6); }
      else if (K === '0') { e.preventDefault(); setSpan(dur); setC0(0); }
    };
    addEventListener('keydown', h); return () => removeEventListener('keydown', h);
  }, [t, sel, edit, view, dur, cur, playing, sp]);

  /* 타임라인 끌기 */
  const tlw = () => (strip.current ? strip.current.clientWidth : 600);
  const onDown = (e) => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const k = +b.dataset.k, r = b.getBoundingClientRect(), dx = e.clientX - r.left;
    const zone = (r.width >= 14 && dx <= 5) ? 'i' : (r.width >= 14 && dx >= r.width - 5) ? 'o' : 'b';
    setDrag({ k, zone, x0: e.clientX, i0: cues[k].in, o0: cues[k].out });
    setSel(k); setEdit(false); strip.current.setPointerCapture(e.pointerId);
  };
  const onMove = (e) => { if (!drag) return;
    const dt = (e.clientX - drag.x0) / tlw() * view, c = cues[drag.k];
    if (drag.zone === 'i') setCue(drag.k, { in: Math.min(drag.o0 - FR, Math.max(0, drag.i0 + dt)) });
    else if (drag.zone === 'o') setCue(drag.k, { out: Math.max(drag.i0 + FR, drag.o0 + dt) });
    else setCue(drag.k, { in: Math.max(0, drag.i0 + dt), out: drag.o0 + dt }); };
  const onUp = (e) => { if (drag) { strip.current.releasePointerCapture(e.pointerId); setDrag(null); } };

  const L = cur ? Math.max(...(cur.ko||'').split('\n').map(x => CLEN(x))) : 0;
  const P = cur ? CLEN(cur.ko||'') / Math.max(0.01, cur.out - cur.in) : 0;

  return (
    <div className="step">
      <h2>프리뷰 — 영상 위에서 확인</h2>
      {/* 자막이 없어도 화면을 그린다. 영상만 먼저 얹어 두고 자막을 불러오는 순서도 있고,
          무엇을 할 수 있는 화면인지 미리 보여야 한다. */}
      {!cues.length &&
        <p className="hint" style={{marginBottom:10}}>자막이 아직 없습니다 — 영상은 지금 얹어 둘 수 있고,
          <b>자막 번역</b>이나 <b>자막 검수</b>에서 자막을 불러오면 이 화면에 그대로 나타납니다.</p>}
      <div className="pv">
        <div className="player">
          <div className="srcbar">
            <input id="pvv" type="file" accept="video/*" hidden
              onChange={e => { openVid(e.target.files[0]); e.target.value=''; }} />
            <input id="pva" type="file" accept="audio/*,video/*" hidden
              onChange={e => { openAud(e.target.files[0]); e.target.value=''; }} />
            {vurl ? <><span className="chipf"><span className="ic" /><b>{vname}</b></span>
              <button className="sm" onClick={()=>document.getElementById('pvv').click()}>교체</button></>
              : <button className="getb" onClick={()=>document.getElementById('pvv').click()}>🎬 영상 가져오기</button>}
            {aurl ? <><span className="chipf"><span className="ic" /><b>{aname}</b></span>
              <button className="sm" onClick={()=>document.getElementById('pva').click()}>교체</button></>
              : <button className="getb gh" onClick={()=>document.getElementById('pva').click()}>🔊 오디오 가져오기</button>}
            <span style={{flex:1}} />
            {ana && <span className="anas">{ana}</span>}
            <span className="snd">
              <button className={snd==='v'?'on':''} disabled={!vurl} onClick={()=>setSnd('v')}>영상</button>
              <button className={snd==='a'?'on':''} disabled={!aurl} onClick={()=>setSnd('a')}>오디오</button>
              <button className={snd==='m'?'on':''} onClick={()=>setSnd('m')}>끔</button>
            </span>
          </div>

          <div className="screen">
            {vurl && <video ref={vid} src={vurl} playsInline
              onLoadedMetadata={() => setVfail('')}
              onError={() => setVfail('이 브라우저에서 재생할 수 없는 형식입니다')} />}
            {!vurl && <div className="drop"><div className="in">
              <b>영상을 가져오세요</b>
              <p>mp4 · webm · H.264 mov<br />ProRes 는 사파리에서만 재생됩니다<br />
                파일은 올라가지 않고 이 컴퓨터에서만 재생됩니다</p></div></div>}
            {vfail && <div className="drop"><div className="in">
              <b>{vfail}</b>
              <p>H.264 프록시를 만들어 쓰세요<br />
                <code style={{fontSize:10.5}}>ffmpeg -i 마스터.mov -vf scale=854:-2 -c:v libx264 -crf 28 프리뷰.mp4</code></p></div></div>}
            <div className="tcb">{tcf(t)}</div>
            <div className="povl">{(cues[idxAt(t)]||{}).ko || ''}</div>
          </div>
          {aurl && <audio ref={aud} src={aurl} />}

          <div className="tr">
            <button className="pb" onClick={toggle} title="재생 · Space">{playing ? '❚❚' : '▶'}</button>
            <button className="ib" onClick={()=>gotoCue(sel-1,true)} disabled={sel<=0}
              title="이전 자막으로 — 그 큐만 재생합니다 · ←">⏮</button>
            <button className="ib" onClick={()=>gotoCue(sel+1,true)} disabled={sel>=cues.length-1}
              title="다음 자막으로 — 그 큐만 재생합니다 · →">⏭</button>
            <span className="sep2" />
            <button className="ib" onClick={()=>nudgeTo(t-FR)} title="1프레임 뒤 · ⇧←">‹</button>
            <button className="ib" onClick={()=>nudgeTo(t+FR)} title="1프레임 앞 · ⇧→">›</button>
            <span className="tnow">{tcf(t)}</span>
            <span style={{flex:1}} />
            {lateCount > 0 && <button className="jump" onClick={nextIssue}><i />다음 문제 큐 {lateCount}</button>}
            <span className="zoom">
              <button onClick={()=>{setSpan(dur);setC0(0);}}>전체</button>
              <button onClick={()=>setZoom(view*1.6)} disabled={view>=dur}>−</button>
              <button className="sp2">{view>=dur-0.01 ? '전체'
                : `${String(Math.floor(view/60)).padStart(2,'0')}:${String(Math.round(view%60)).padStart(2,'0')}`}</button>
              <button onClick={()=>setZoom(view/1.6)} disabled={view<=1.5}>+</button>
            </span>
          </div>

          <div className="tl" onClick={e => { if (e.target.closest('[data-k]') || drag) return;
              const r = strip.current.getBoundingClientRect();
              seek(c0 + (e.clientX - r.left)/r.width*view); }}
            onWheel={e => { e.preventDefault();
              const r = strip.current.getBoundingClientRect();
              setZoom(view * (e.deltaY > 0 ? 1.18 : 1/1.18), c0 + (e.clientX - r.left)/r.width*view); }}>
            <canvas ref={wf} />
            <div className="cuest" ref={strip}
              onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp}>
              {cues.map((c,k) => { const a = t2f(c.in), b = t2f(c.out);
                if (b < -0.05 || a > 1.05) return null;
                return <i key={k} data-k={k} title={'#'+(k+1)}
                  className={sel===k ? 'sel' : c.edited ? 'ed' : late(c) ? 'bad' : ''}
                  style={{left:`${a*100}%`, width:`${Math.max(.2,(b-a)*100)}%`}} />; })}
            </div>
            {t2f(t) >= 0 && t2f(t) <= 1 &&
              <div className="head" style={{left:`calc(10px + ${t2f(t)} * (100% - 20px))`}} />}
          </div>

          {cur && <div className="eb">
            <div className="ebh">
              <span className="no">#{sel+1}</span>
              <span className={'st2' + (late(cur) ? ' bad' : '')}>
                {!sp.length ? '오디오를 가져오면 발화와 맞는지 봅니다'
                  : late(cur) ? `말이 ${Math.abs(offOf(cur)).toFixed(2)}초 먼저 시작합니다`
                  : offOf(cur) === null ? '가까운 발화를 못 찾았습니다' : '발화와 잘 맞습니다'}</span>
              <span style={{flex:1}} />
              <span className={'met' + (L>lim || P>SPOT.cpsMax ? ' over' : '')}>{L}자 · 초당 {P.toFixed(1)}자</span>
            </div>
            {edit
              ? <textarea autoFocus rows={Math.max(2,(cur.ko||'').split('\n').length)} defaultValue={cur.ko||''}
                  onBlur={e => { setCue(sel, { ko: e.target.value }); setEdit(false); }}
                  onKeyDown={e => { if (e.key === 'Escape') setEdit(false); }} />
              : <div className="ebtxt" onClick={() => { setEdit(true); if (playing) toggle(); }}>
                  {cur.ko || <span style={{color:'var(--dim3)'}}>(빈 자막) — 눌러서 입력</span>}</div>}
            <div className="io">
              <span className="iog"><span className="lb">IN</span>
                <span className={'v' + (cur.tin0 !== undefined ? ' moved' : '')}>{tcf(cur.in)}</span>
                <button onClick={()=>nudge('i',-1)}>‹</button><button onClick={()=>nudge('i',1)}>›</button>
                <button className="set" onClick={()=>setCue(sel,{in:Math.min(t,cur.out-FR)})}>지금</button></span>
              <span className="iog"><span className="lb">OUT</span>
                <span className={'v' + (cur.tin0 !== undefined ? ' moved' : '')}>{tcf(cur.out)}</span>
                <button onClick={()=>nudge('o',-1)}>‹</button><button onClick={()=>nudge('o',1)}>›</button>
                <button className="set" onClick={()=>setCue(sel,{out:Math.max(t,cur.in+FR)})}>지금</button></span>
              <span style={{flex:1}} />
              <button className="sm" onClick={()=>nudge('b',-1)}>◀ 통째로</button>
              <button className="sm" onClick={()=>nudge('b',1)}>통째로 ▶</button>
              <button className="sm" disabled={!sp.length} onClick={snap}>발화에 붙이기</button>
              {(cur.tin0 !== undefined || cur.was0 !== undefined) &&
                <button className="sm" onClick={revert}>되돌리기</button>}
            </div>
            <div className="keys">
              <span><b>← →</b>앞뒤 자막 (그 큐만 재생)</span><span><b>⇧← →</b>1프레임</span>
              <span><b>Space</b>재생</span><span><b>I</b>인점</span><span><b>O</b>아웃점</span>
              <span><b>N</b>다음 문제</span><span><b>+ −</b>확대·축소</span><span><b>0</b>전체</span>
            </div>
          </div>}
        </div>

        <div className="side">
          <div className="sh"><b>자막</b>
            <span className="c">{cues.length}큐{lateCount ? ` · 늦음 ${lateCount}` : ''}</span></div>
          <div className="flt">
            {[['all','전체'],['late','늦음'],['edit','수정됨']].map(([k,lab]) => (
              <button key={k} className={filt===k?'on':''} onClick={()=>setFilt(k)}>{lab}</button>
            ))}
          </div>
          <div className="listbox"><div className="list">
            {shown.length === 0 ? <div className="empty2">해당하는 큐가 없습니다</div>
              : shown.map(([c,k]) => (
              <div key={k} className={'cue' + (sel===k?' on':'')}
                onClick={() => gotoCue(k, playing)}>
                <span className="n">{k+1}</span>
                <span className="b">
                  <span className="t">{s2(c.in).slice(3,8)}<span className="d">{(c.out-c.in).toFixed(2)}초</span></span>
                  <span className="k">{(c.ko||'').replace(/\n/g,' ') || '—'}</span>
                  {(late(c) || c.edited) && <span className="dots">
                    {late(c) && <i className="late" />}{c.edited && <i className="ed" />}
                    <span>{[late(c)&&'늦음', c.edited&&'고침'].filter(Boolean).join(' · ')}</span></span>}
                </span>
              </div>
            ))}
          </div></div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [raw, setRaw]       = useState(null);   // 원본 큐
  const [meta, setMeta]     = useState('');
  const [cues, setCues]     = useState([]);     // 작업 큐
  const [dropSFX, setSFX]   = useState(true);
  const keepNote = false;                       // ♪ 기호는 쓰지 않는다 (사양서 4.5)
  const [bang, setBang]     = useState(true);   // 느낌표 허용 (납품본 17,260큐 중 7.0%)
  const [songOn, setSongOn] = useState(new Set());   // 번역할 곡 구간 id
  const [scale, setScale]   = useState('1');    // 프레임레이트 보정
  const [fps, setFps]       = useState('23.976');  // 프레임 타임코드 해석용
  const [mode, setMode]     = useState(START === 'review' ? 'review' : 'translate');   // translate | review
  const [screen, setScreen] = useState(START === 'preview' ? 'preview' : 'work');      // work | preview
  // 화면 밝기 — 밝게 / 어둡게 두 가지.
  // 고른 적이 없으면 OS 설정을 따르고, 한 번 누르면 그때부터 고른 값으로 고정된다.
  const [theme, setTheme] = useState(() => {
    if (EMBED && (EMBED_THEME === 'light' || EMBED_THEME === 'dark')) return EMBED_THEME;
    try { const v = localStorage.getItem('sublab-theme'); if (v === 'light' || v === 'dark') return v; } catch(e) {}
    return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  });
  /* 감싸는 앱이 밝기를 바꾸면 따라간다 — 밝기는 앱 전체 설정이다 */
  useEffect(() => {
    if (!EMBED) return;
    const h = e => { const t = e.data && e.data.setTheme;
      if (t === 'light' || t === 'dark') setTheme(t); };
    addEventListener('message', h); return () => removeEventListener('message', h);
  }, []);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('sublab-theme', theme); } catch(e) {}
  }, [theme]);
  const [offset, setOffset] = useState('0');
  const [zeroMode, setZeroMode] = useState('none');   // 시작 시간 맞추기: none | hour | zero
  const [expFmt, setExpFmt] = useState(() => {       // 내려받을 형식: srt | txt | csv
    try { const v = localStorage.getItem('sublab-expfmt'); if (v === 'srt' || v === 'txt' || v === 'csv') return v; } catch (e) {}
    return 'srt';
  });
  useEffect(() => { try { localStorage.setItem('sublab-expfmt', expFmt); } catch (e) {} }, [expFmt]);
  const [showRules, setShowRules] = useState(false);
  const [ruleQ, setRuleQ] = useState('');
  const [showSpell, setShowSpell] = useState(false);   // 맞춤법 결과 검토 패널
  const [lim, setLim]       = useState(13);   // 사양서 03: 한 줄 13자 이내 (공백 제외)
  const [key, setKey]       = useState(localStorage.getItem('ak') || '');
  const [model, setModel]   = useState('claude-opus-5');
  const [effort, setEffort] = useState('medium');
  const [gloss, setGloss]   = useState('');
  const [terms, setTerms]   = useState([]);   // 원문 용어 후보
  const [tone, setTone]     = useState('영화 자막 톤. 현대 구어체. 사극 말투(-하오, -옵니다, -이니라, -소서, -거늘)는 쓰지 않는다. 손윗사람의 위엄은 해라체로 살린다. 욕설은 원문 수위대로 직역.');
  const [notes, setNotes]   = useState('');
  const [prog, setProg]     = useState(null);
  const [busy, setBusy]     = useState(false);
  const [err, setErr]       = useState('');
  const [filter, setFilter] = useState('all');
  const dropRef = useRef(null);
  const [refs, setRefs] = useState([]);        // 참고 자막 [{label, cues}]
  const [srcLang, setSrcLang] = useState('en'); // 원문 언어 (자동 감지 후 수동 변경 가능)
  const [files, setFiles] = useState([]);       // 불러온 자막 [{name, cues, lang, role}]
  const [base, setBase] = useState(null);       // 검수할 기존 번역본 {label, cues}
  const [find, setFind]   = useState('');       // 찾기
  const [repl, setRepl]   = useState('');       // 바꾸기
  const [onCat, setOnCat] = useState(new Set());  // 사유 갈래 필터
  const [onBy, setOnBy]   = useState(new Set());  // 무엇이 바꿨나 필터
  const [step, setStep]   = useState(null);     // 펼친 단계
  const [tick, setTick]   = useState(0);        // 되돌리기 버튼 갱신
  const [saved, setSaved] = useState('');       // 저장 상태
  const [keySaved, setKeySaved] = useState(() => !!localStorage.getItem('ak'));
  const past = useRef([]), future = useRef([]);

  // 여러 파일을 한 번에 읽고 언어를 감지해 역할을 미리 정해 둔다
  const readAll = async (list) => {
    setErr('');
    const added = [];
    for (const file of [...list]) {
      try {
        const buf = await file.arrayBuffer();
        let cues, info, tc = false, fam = null;
        if (/\.stl$/i.test(file.name)) {
          const r = parseSTL(buf); cues = r.cues; info = `STL · ${r.fps.toFixed(3)}fps`;
        } else {
          const txt = decodeText(buf);
          if (/\.csv$/i.test(file.name)) {            // 스프레드시트
            const r = parseCSV(txt, fps);
            cues = r.cues; tc = r.tc;
            info = r.tc ? `CSV · 프레임 TC · ${fps.replace('df',' DF')}` : 'CSV';
          } else if (isFrameTC(txt)) {                 // 프리미어 텍스트 내보내기
            const use = isDropFrame(txt) ? '29.97df' : fps;   // 세미콜론이면 드롭프레임
            if (use !== fps) setFps(use);
            const r = parseFrameTC(txt, use);
            cues = r.cues; tc = !r.ms;
            fam = r.ms ? null : fpsFamily(r.maxF, isDropFrame(txt));
            info = r.ms ? '이미 SRT' : `프레임 TC · ${use.replace('df',' DF')}`;
          } else if (isCSV(txt)) {                     // 확장자가 달라도 내용이 CSV 면
            const r = parseCSV(txt, fps);
            cues = r.cues; tc = r.tc;
            info = r.tc ? `CSV · 프레임 TC · ${fps.replace('df',' DF')}` : 'CSV';
          } else { cues = parseSRT(txt); info = 'SRT'; }
        }
        if (!cues.length) throw new Error('큐를 읽지 못했습니다');
        added.push({ name: file.name, cues, info, tc, fam, lang: detectLang(cues), role: 'ref' });
      } catch (e) { setErr(`${file.name}: ${e.message}`); }
    }
    if (added.length) { setRaw(null); setCues([]); setMeta(''); setProg(null); }
    setFiles(prev => {
      // 검수는 한 번에 한 편이다. 새로 넣은 파일만 남긴다.
      const merged = mode === 'review' ? [] : [...prev];
      for (const a of added) if (!merged.some(m => m.name === a.name)) merged.push(a);
      // 번역 대상 자동 선택: 영어 > 중국어 순, 한국어는 참고로만
      if (mode === 'review') {
        // 검수는 한 번에 한 편이다. 새로 넣은 파일이 검수 대상이 된다.
        const last = added.length ? merged.find(m => m.name === added[added.length-1].name) : null;
        for (const m of merged) m.role = 'ref';
        if (last) last.role = 'source';
      } else if (!merged.some(m => m.role === 'source')) {
        // 프리미어에서 뽑은 한글 자막은 번역 없이 바로 검수 대상이 된다
        const tcko = merged.find(m => m.tc && m.lang === 'ko');
        const pick = tcko || merged.find(m => m.lang === 'en') || merged.find(m => m.lang === 'zh');
        if (pick) pick.role = 'source';
      }
      if (!merged.some(m => m.role === 'base')) {
        const ko = merged.find(m => m.lang === 'ko' && m.role === 'ref');
        if (ko) ko.role = 'base';
      }
      return merged;
    });
  };

  // 01 단계 확정 — 선택한 역할대로 원문과 참고를 세팅한다
  const commitFiles = () => {
    const src = files.find(f => f.role === 'source');
    if (!src) { setErr('번역할 원문을 하나 골라주세요.'); return; }
    setErr('');
    setSrcLang(src.lang === 'ko' ? 'en' : src.lang);
    setRaw(src.cues);
    setMeta(`${src.name} — ${src.info} · ${src.cues.length}큐 · ${LANG_NAME[src.lang]}`);
    setRefs(files.filter(f => f.role === 'ref')
                 .map(f => ({ label: f.name.replace(/\.[^.]+$/,'').slice(0,14), cues: f.cues })));
    const b = mode === 'review' ? src                          // 검수 모드는 원문이 곧 검수 대상
              : (files.find(f => f.role === 'base')
                 || (src.tc && src.lang === 'ko' ? src : null));
    setBase(b ? { label: b.name.replace(/\.[^.]+$/,'').slice(0,14), cues: b.cues } : null);
    setCues([]); setProg(null);
    if (/\.stl$/i.test(src.name)) setScale('1');
  };

  // 탭을 바꾸면 하던 작업을 비운다. 두 갈래가 섞이면 결과가 헷갈린다.
  const reset = () => {
    setFiles([]); setRaw(null); setCues([]); setMeta('');
    setBase(null); setRefs([]); setTerms([]);
    setProg(null); setErr(''); setSongOn(new Set());
  };

  // 참고 자막을 타임코드가 가장 많이 겹치는 큐에 붙인다
  const attachRef = (list, label, refCues) => list.map(c => {
    let best = null, bestOv = 0;
    for (const r of refCues) {
      const ov = Math.max(0, Math.min(c.out, r.out) - Math.max(c.in, r.in));
      if (ov > bestOv) { bestOv = ov; best = r; }
    }
    const half = 0.5 * Math.min(c.out - c.in, best ? best.out - best.in : 0);
    return { ...c, refs: { ...(c.refs || {}), [label]: (best && bestOv >= half) ? best.en : '' } };
  });

  const readRef = async (file) => {
    try {
      const buf = await file.arrayBuffer();
      const txt2 = /\.stl$/i.test(file.name) ? null : decodeText(buf);
      const parsed = /\.stl$/i.test(file.name) ? parseSTL(buf).cues
                   : (/\.csv$/i.test(file.name) || isCSV(txt2)) ? parseCSV(txt2, fps).cues
                   : parseSRT(txt2);
      if (!parsed.length) throw new Error('큐를 읽지 못했습니다');
      const label = file.name.replace(/\.[^.]+$/, '').slice(0, 14);
      setRefs(prev => prev.some(r => r.label === label) ? prev : [...prev, { label, cues: parsed }]);
      setCues(prev => prev.length ? attachRef(prev, label, parsed) : prev);
    } catch (e) { setErr('참고 자막 읽기 실패: ' + e.message); }
  };

  const songs = useMemo(() => raw ? detectSongs(raw) : [], [raw]);
  const songMap = useMemo(() => {
    const m = {}; songs.forEach(s => s.idx.forEach(i => { m[i] = s.id; })); return m;
  }, [songs]);

  const filtered = useMemo(() => {
    if (!raw) return [];
    const k = parseFloat(scale) || 1, o = parseFloat(offset) || 0;
    return applyFilters(raw, { dropSFX, songOn, songMap, keepEmpty: mode === 'review' })
      .map(c => ({ ...c, in: c.in*k + o, out: c.out*k + o, ko: '', sugg: null, edited: false }));
  }, [raw, dropSFX, songOn, songMap, scale, offset, mode]);

  /* 첫 큐에서 덜어낼 양. 0 이면 옮기지 않는다. */
  const zshift = useMemo(() => zeroShift(filtered, zeroMode), [filtered, zeroMode]);

  const prepared = useMemo(() =>
    zshift ? filtered.map(c => ({ ...c, in: c.in - zshift, out: c.out - zshift })) : filtered,
    [filtered, zshift]);

  const translate = async () => {
    if (!key) { setErr('API 키를 입력하세요.'); return; }
    setErr(''); setBusy(true);
    let work = prepared.map(c => ({ ...c }));
    for (const r of refs) work = attachRef(work, r.label, r.cues);
    setCues(work);
    // 대사/가사가 섞이지 않도록 같은 종류끼리 배치를 만든다 (지침이 다르므로)
    const B = 40, batches = [];
    for (let s = 0; s < work.length; ) {
      const kind = work[s].kind; let e = s;
      while (e < work.length && work[e].kind === kind && e - s < B) e++;
      batches.push({ kind, from: s, to: e }); s = e;
    }
    let done = 0; const missing = [];
    try {
      for (const b of batches) {
        const chunk = work.slice(b.from, b.to);
        const system = sysPrompt({ glossary: gloss, tone, lim, notes, lyric: b.kind === 'lyric', srcLang, bang });
        /* 직전 배치의 끝자락을 문맥으로 넘긴다 — 없으면 40큐마다 말투가 새로 추측된다 */
        const back = work.slice(Math.max(0, b.from - 8), b.from).filter(c => (c.ko||'').trim());
        const head = back.length
          ? '[앞선 대사 — 번역하지 말 것. 말투와 호칭을 여기에 맞춘다]\n'
            + back.map(c => `${(c.en||'').replace(/\n/g,' ')}  →  ${(c.ko||'').replace(/\n/g,' ')}`
                + (c.who ? `  (${c.who})` : '')).join('\n')
            + '\n\n[여기부터 번역]\n'
          : '';
        const user = head + chunk.map((c, i) => {
          const head = `${i+1}. ${c.en.replace(/\n/g,' ⏎ ')}`;
          const extra = refCols
            .map(lab => [lab, ((c.refs || {})[lab] || '').replace(/\n/g,' ⏎ ').trim()])
            .filter(([, t]) => t)
            .map(([lab, t]) => `   [${lab}] ${t}`);
          return [head, ...extra].join('\n');
        }).join('\n');
        const { text } = await callClaude({ key, model, effort, system, user, schema: ARR_SCHEMA });
        let arr;
        try { arr = JSON.parse(text).lines; } catch (e) { throw new Error('응답 파싱 실패: ' + text.slice(0,200)); }
        if (!Array.isArray(arr)) throw new Error('응답이 배열이 아닙니다');
        const byN = new Map(arr.filter(o => o && typeof o.n === 'number').map(o => [o.n, o.ko]));
        const byWho = new Map(arr.filter(o => o && typeof o.n === 'number' && o.who).map(o => [o.n, o.who]));
        chunk.forEach((c, i) => {
          const v = byN.get(i + 1);
          if (v == null) { missing.push(b.from + i + 1); c.ko = ''; return; }
          c.ko = finalize(v, { keepNote, lim, kind: c.kind });
          const w = byWho.get(i + 1); if (w) c.who = w;
        });
        done = b.to;
        setCues([...work]);
        setProg({ done, total: work.length });
      }
      localStorage.setItem('ak', key);
      if (missing.length) setErr(`⚠ ${missing.length}개 큐를 모델이 빠뜨렸습니다 (#${missing.slice(0,10).join(', #')}${missing.length>10?' …':''}). `
        + `번호로 맞춰 넣었으므로 다른 자막은 밀리지 않았습니다. 해당 큐만 '재번역 2안'으로 채우세요.`);
    } catch (e) { setErr('번역 중단: ' + e.message); }
    setBusy(false);
  };

  /* 여러 큐를 한 번에 바꾸는 동작은 모두 되돌릴 수 있게 기록한다 (최대 50단계) */
  const HIST = 50;
  const apply = useCallback((fn) => {
    setCues(prev => {
      const next = fn(prev);
      if (next === prev) return prev;
      past.current.push(prev);
      if (past.current.length > HIST) past.current.shift();
      future.current = [];
      return next;
    });
    setTick(t => t + 1);
  }, []);
  const undo = useCallback(() => {
    if (!past.current.length) return;
    setCues(prev => { future.current.push(prev); return past.current.pop(); });
    setTick(t => t + 1);
  }, []);
  const redo = useCallback(() => {
    if (!future.current.length) return;
    setCues(prev => { past.current.push(prev); return future.current.pop(); });
    setTick(t => t + 1);
  }, []);
  useEffect(() => {
    const h = (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
      if (/input|textarea/i.test(e.target.tagName)) return;
      e.preventDefault(); e.shiftKey ? redo() : undo();
    };
    addEventListener('keydown', h); return () => removeEventListener('keydown', h);
  }, [undo, redo]);

  /* 무엇이 언제 바뀌었는지 남긴다 — 수정됨에서 전후를 보여주기 위해 */
  const mark = (c, patch, by) => ({
    ...c, ...patch,
    was0: (patch.ko !== undefined && c.was0 === undefined) ? (c.ko || '') : c.was0,
    by, edited: true,
  });
  const undoOne = (c, by) => {
    const n = { ...c };
    if (n.was0 !== undefined) { n.ko = n.was0; delete n.was0; }
    if (n.tin0 !== undefined) { n.in = n.tin0; n.out = n.tout0; delete n.tin0; delete n.tout0; }
    if ((by || n.by) === 'scr') n.track = 'main';
    delete n.by; n.edited = false;
    return n;
  };
  const revertCue = useCallback((idx) =>
    apply(prev => prev.map((c, k) => k === idx ? undoOne(c) : c)), [apply]);
  const revertBy = useCallback((by) =>
    apply(prev => prev.map(c => c.by === by ? undoOne(c, by) : c)), [apply]);

  const setKo = useCallback((idx, v) => {
    setCues(prev => prev.map((c, i) => i === idx
      ? { ...c, ko: v, sugg: null, edited: true, by: 'man',
          was0: c.was0 === undefined ? (c.ko || '') : c.was0 } : c));
  }, []);

  /* 맞춤법 검사 — 고칠 것만 돌려받아 큐에 붙인다. 바로 반영하지 않고 제안으로 둔다. */
  const spellcheck = async () => {
    if (!key) { setErr('API 키를 입력하세요. 맞춤법 검사는 Claude 를 씁니다.'); return; }
    const work = cues.map(c => ({ ...c, spell: null }));
    const idx = work.map((c, i) => [c, i]).filter(([c]) => (c.ko || '').trim());
    if (!idx.length) { setErr('검사할 자막이 없습니다.'); return; }
    setErr(''); setBusy(true); setProg({ done: 0, total: idx.length });
    let hit = 0;
    try {
      const B = 60;
      for (let s0 = 0; s0 < idx.length; s0 += B) {
        const chunk = idx.slice(s0, s0 + B);
        const user = chunk.map(([c], i) => `${i+1}. ${c.ko.replace(/\n/g, ' ⏎ ')}`).join('\n');
        const { text } = await callClaude({
          key, model, effort, system: SPELL_PROMPT, user, schema: SPELL_SCHEMA, maxTokens: 8000 });
        let fixes = [];
        try { fixes = JSON.parse(text).fixes || []; }
        catch (e) { throw new Error('응답 파싱 실패: ' + text.slice(0, 160)); }
        for (const f of fixes) {
          const pair = chunk[f.n - 1];
          if (!pair || typeof f.ko !== 'string') continue;
          const ko = unmark(f.ko);
          if (!ko || ko === pair[0].ko) continue;
          work[pair[1]].spell = { ko, why: (f.why || '맞춤법').slice(0, 24) };
          hit++;
        }
        setCues([...work]);
        setProg({ done: Math.min(s0 + B, idx.length), total: idx.length });
      }
      localStorage.setItem('ak', key);
      setErr(hit ? '' : '맞춤법 문제를 찾지 못했습니다.');
      setShowSpell(hit > 0);   // 걸린 게 있으면 바로 검토 패널을 편다
    } catch (e) { setErr('맞춤법 검사 중단: ' + e.message); }
    setBusy(false);
  };

  const suggest = useCallback(async (idx, retranslate) => {
    const c = cues[idx];
    if (!retranslate) {
      const flat = (c.ko || '').split('\n').join(' ').replace(/\s+/g,' ').trim();
      setCues(prev => prev.map((x,i) => i===idx ? { ...x, sugg: splitCandidates(flat, lim).map(a => a.join('\n')) } : x));
      return;
    }
    setBusy(true); setErr('');
    try {
      const { text } = await callClaude({
        key, model, effort, maxTokens: 4000,
        system: sysPrompt({ glossary: gloss, tone, lim, notes, srcLang, bang }),
        user: `아래 자막 한 개를 서로 다른 방식으로 2가지 번역해라. ⏎ 는 줄바꿈이다.\n`
            + `결과의 줄바꿈은 실제 개행으로 쓰고 ⏎ 기호는 쓰지 마라.\n\n`
            + `현재 번역: ${c.ko}\n원문: ${c.en.replace(/\n/g,' ⏎ ')}`,
        schema: ALT_SCHEMA,
      });
      const arr = JSON.parse(text).alts.slice(0, 2);
      setCues(prev => prev.map((x,i) => i===idx ? { ...x, sugg: arr.map(a => finalize(a, { keepNote, lim, kind: c.kind })) } : x));
    } catch (e) { setErr('재번역 실패: ' + e.message); }
    setBusy(false);
  }, [cues, key, model, effort, gloss, tone, lim, notes, keepNote]);

  const view = useMemo(() => {
    let out = cues.map((c,i)=>[c,i]);
    if (filter === 'sus') out = out.filter(([c]) => {
      const ws = inspect(c.ko||'', lim, c.kind, c.en||'', c.out - c.in);
      if (!ws.length) return false;
      if (ruleQ && !ws.some(x => ruleKey(x) === ruleQ)) return false;
      if (onCat.size && !ws.some(x => onCat.has(catOf(x)))) return false;
      return true;
    });
    else if (filter === 'edit') out = out.filter(([c]) =>
      c.edited && (!onBy.size || onBy.has(c.by || 'man')));
    if (find) out = out.filter(([c]) => (c.ko||'').includes(find));
    return out;
  }, [cues, filter, lim, ruleQ, onCat, onBy, find]);

  /* 갈래별 건수 — 의심 하위 필터의 숫자 */
  const catCount = useMemo(() => {
    const m = {};
    for (const c of cues)
      for (const w of inspect(c.ko||'', lim, c.kind, c.en||'', c.out - c.in)) {
        const k = catOf(w); m[k] = (m[k]||0) + 1;
      }
    return m;
  }, [cues, lim]);

  /* 무엇이 바꿨는지별 건수 */
  const byCount = useMemo(() => {
    const m = {};
    for (const c of cues) if (c.edited) { const k = c.by || 'man'; m[k] = (m[k]||0) + 1; }
    return m;
  }, [cues]);

  const editCount = useMemo(() => cues.filter(c => c.edited).length, [cues]);
  /* 검수 모드는 원문이 비어 있다 — 빈 컬럼이 자리만 차지하지 않게 숨긴다 */
  const showEn = useMemo(() => cues.some(c => (c.en || '').trim()), [cues]);

  /* 찾기 · 바꾸기 — 지금 화면에 보이는 큐에만 적용한다 */
  const replaceAll = () => {
    if (!find) return;
    const ids = new Set(view.map(([, i]) => i));
    apply(prev => prev.map((c, i) => (ids.has(i) && (c.ko||'').includes(find))
      ? mark(c, { ko: c.ko.split(find).join(repl) }, 'man') : c));
    setSaved(`«${find}» → «${repl}» · ${ids.size}큐`);
    setFind('');   // 바꾼 큐가 필터에서 빠져 표가 비어 보이는 것을 막는다
  };

  const refCols = useMemo(() => refs.map(r => r.label), [refs]);

  // 검수할 번역본이 있으면 번역 없이 결과 자리에 채운다 (API 호출 없음)
  useEffect(() => {
    if (!base || !prepared.length) return;
    let work = prepared.map(c => ({ ...c }));
    for (const r of refs) work = attachRef(work, r.label, r.cues);
    work = work.map(c => {
      let best = null, bestOv = 0;
      for (const r of base.cues) {
        const ov = Math.max(0, Math.min(c.out, r.out) - Math.max(c.in, r.in));
        if (ov > bestOv) { bestOv = ov; best = r; }
      }
      const half = 0.5 * Math.min(c.out - c.in, best ? best.out - best.in : 0);
      return (best && bestOv >= half) ? { ...c, ko: best.en } : c;
    });
    setCues(work);
  }, [base, prepared]);

  const susCount = useMemo(() => cues.filter(c => inspect(c.ko||'', lim, c.kind, c.en||'', c.out - c.in).length).length, [cues, lim]);
  const ruleStat = useMemo(() => {
    const m = {}; let total = 0;
    for (const c of cues)
      for (const wname of inspect(c.ko||'', lim, c.kind, c.en||'', c.out - c.in)) {
        const key = ruleKey(wname);
        m[key] = (m[key]||0) + 1; total++;
      }
    return { total, rows: Object.entries(m).sort((a,b) => b[1]-a[1]) };
  }, [cues, lim]);

  const subCount = useMemo(() => cues.filter(c => c.track === 'sub').length, [cues]);

  /* 마무리 작업 — 업무 순서대로 */
  const runStep = (id) => {
    if (id === 'fmt') apply(prev => prev.map(c => {
      const ko = finalize(c.ko||'', { keepNote, lim, kind: c.kind });
      return ko === (c.ko||'') ? c : mark(c, { ko }, 'fmt');
    }));
    else if (id === 'spell') spellcheck();
    else if (id === 'spot') apply(prev => {
      const seeded = prev.map(c => c.tin0 === undefined ? { ...c, tin0: c.in, tout0: c.out } : c);
      return respot(seeded, lim).map(c => {
        if (c.in === c.tin0 && c.out === c.tout0) {
          const { tin0, tout0, ...rest } = c;
          return rest.by === 'spot' ? { ...rest, by: undefined, edited: false } : rest;
        }
        return { ...c, by: 'spot', edited: true };
      });
    });
    else if (id === 'scr') apply(prev => prev.map(c =>
      (c.track !== 'sub' && isScreenInfo(c.ko||'', c.en||'')) ? mark(c, { track: 'sub' }, 'scr') : c));
    else if (id === 'rule') setShowRules(v => !v);
    else if (id === 'dl') download();
  };
  const stepTargets = (id) => {
    if (id === 'fmt')  return cues.filter(c => finalize(c.ko||'', { keepNote, lim, kind: c.kind }) !== (c.ko||'')).length;
    if (id === 'spell') return cues.filter(c => c.spell).length;
    if (id === 'scr')  return cues.filter(c => c.track !== 'sub' && isScreenInfo(c.ko||'', c.en||'')).length;
    return 0;
  };

  const saveKey = () => { if (!key) return; localStorage.setItem('ak', key); setKeySaved(true); setSaved('API 키 저장됨'); };
  const clearKey = () => { localStorage.removeItem('ak'); setKey(''); setKeySaved(false); setSaved('API 키 지움'); };

  /* 지난 작업 이어서 하기.
     자동 저장은 하고 있었는데 다시 읽는 곳이 없어서 브라우저를 닫으면 사라졌다.
     시작할 때 한 번 읽어 두고, 물어본 뒤에 넣는다. 말없이 덮어쓰지 않는다. */
  const [resume, setResume] = useState(() => {
    try {
      const d = JSON.parse(localStorage.getItem('sublab-work') || 'null');
      return (d && Array.isArray(d.cues) && d.cues.length) ? d : null;
    } catch (e) { return null; }
  });
  const doResume = () => {
    if (!resume) return;
    setCues(resume.cues);
    if (resume.meta) setMeta(resume.meta);
    if (resume.lim) setLim(resume.lim);
    if (resume.mode === 'review' || resume.mode === 'translate') setMode(resume.mode);
    past.current = []; future.current = []; setTick(t => t + 1);
    setErr(''); setSaved('지난 작업을 이어서 엽니다'); setResume(null);
  };
  const dropResume = () => {
    try { localStorage.removeItem('sublab-work'); } catch (e) {}
    setResume(null); setSaved('지난 작업을 지웠습니다');
  };

  /* 저장 — 자동(브라우저) + 작업 파일(.sublab.json) */
  const workName = () => (meta.split(' —')[0] || 'subtitle').replace(/\.[^.]+$/, '');
  useEffect(() => {
    if (!cues.length) return;
    const t = setTimeout(() => {
      try {
        localStorage.setItem('sublab-work', JSON.stringify({ v:1, ts: Date.now(), meta, mode, lim, cues }));
        setSaved('자동 저장됨');
      } catch (e) { setSaved('자동 저장 실패 — 용량 초과'); }
    }, 900);
    return () => clearTimeout(t);
  }, [cues, meta, mode, lim]);
  const saveWork = () => {
    const name = workName() + '.sublab.json';
    const blob = new Blob([JSON.stringify({ v:1, meta, mode, lim, cues })], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
    setSaved(name + ' 저장됨');
  };
  const openWork = (file) => {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.cues)) throw new Error('cues 없음');
        setCues(d.cues); if (d.meta) setMeta(d.meta); if (d.lim) setLim(d.lim);
        past.current = []; future.current = []; setTick(t => t + 1);
        setSaved(file.name + ' 에서 불러옴'); setErr('');
      } catch (e) { setErr('작업 파일을 읽지 못했습니다 — ' + e.message); }
    };
    r.readAsText(file);
  };

  /* 내보내기 — 세 형식 모두 이 앱이 다시 읽을 수 있는 모양으로 쓴다.
     srt 납품 표준 · txt 프리미어 텍스트와 같은 꼴 · csv 스프레드시트 검토용
     세 형식 다 BOM 을 붙인다. 엑셀은 BOM 이 없으면 한글을 깬다. */
  const csvCell = (v) => { const t = String(v == null ? '' : v);
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const BUILD = {
    srt: (list) => list.map((c, i) => `${i+1}\n${s2t(c.in)} --> ${s2t(c.out)}\n${c.ko}\n`).join('\n'),
    txt: (list) => list.map(c => `${s2t(c.in)} - ${s2t(c.out)}\n${c.ko}\n`).join('\n'),
    csv: (list) => ['번호,시작,종료,원문,한글자막']
      .concat(list.map((c, i) =>
        [i+1, s2t(c.in), s2t(c.out), c.en || '', c.ko || ''].map(csvCell).join(',')))
      .join('\r\n') + '\r\n',
  };
  const download = () => {
    const base = (meta.split(' —')[0] || 'subtitle').replace(/\.[^.]+$/, '');
    const save = (list, suffix) => {
      if (!list.length) return;
      const body = (BUILD[expFmt] || BUILD.srt)(list);
      const blob = new Blob(['﻿' + body], {
        type: (expFmt === 'csv' ? 'text/csv' : 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + suffix + '.' + expFmt;
      a.click(); URL.revokeObjectURL(a.href);
    };
    const on = cues.filter(c => (c.ko||'').trim());
    save(on.filter(c => c.track !== 'sub'), '_KO');
    save(on.filter(c => c.track === 'sub'), '_KO_sub');
  };

  return (
    <div className="wrap">
      {!EMBED && <h1>SubLab</h1>}
      <p className="lede">
        해외 자막을 <b>한글로 번역</b>하고, 프리미어에서 뽑은 텍스트를 <b>SRT로 변환</b>합니다.
        어느 쪽이든 <b>「한국어 자막 제작 사양」 기준으로 검수</b>합니다.
        규칙 위반은 자동 수정하고 애매한 부분은 2가지 안을 제시하며, 그래도 이상하면 표에서 직접 고칠 수 있습니다.
        파일은 브라우저 안에서만 처리되고 <b>번역할 때만</b> Anthropic API로 전송됩니다 — 변환·검수는 API 키 없이 됩니다.
      </p>

      <div className="tabs" style={EMBED ? {display:'none'} : undefined}>
        <div className={'tabbar' + (screen==='preview' ? ' b3' : mode==='review' ? ' b2' : '')} role="tablist">
          <span className="ind" aria-hidden="true" />
          <button role="tab" aria-selected={screen==='work' && mode==='translate'}
            onClick={() => { setScreen('work'); if (mode!=='translate') { setMode('translate'); reset(); } }}>
            자막 번역</button>
          <button role="tab" aria-selected={screen==='work' && mode==='review'}
            onClick={() => { setScreen('work'); if (mode!=='review') { setMode('review'); reset(); } }}>
            자막 검수</button>
          <button role="tab" aria-selected={screen==='preview'}
            onClick={() => setScreen('preview')}>프리뷰</button>
        </div>
        <span className="tabnote">{screen==='preview'
          ? '영상을 얹어 자막을 보면서 타이밍과 문장을 잡습니다 · 같은 자막을 씁니다'
          : mode==='translate'
          ? '해외 자막(중국어·영어)을 한글로 번역하고 검수합니다 · API 키 필요'
          : '이미 한글인 자막을 검수만 합니다 · API 키 없이 됩니다'}</span>
        <button className={'theme' + (theme==='dark' ? ' dark' : '')}
          onClick={() => setTheme(theme==='dark' ? 'light' : 'dark')}
          aria-label="화면 밝기 전환"
          title={theme==='dark' ? '어둡게 — 눌러서 밝게' : '밝게 — 눌러서 어둡게'}>
          <span className="knob" aria-hidden="true" />
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <circle className="ic" cx="12" cy="12" r="4.2"/>
            <g className="ic"><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 5 5M19 19l-1.5-1.5M17.5 6.5 19 5M5 19l1.5-1.5"/></g>
          </svg>
          <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
            <path className="ic" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.8 8.8 0 1 0 11.1 11.1Z"/>
          </svg>
        </button>
      </div>

      {resume && !cues.length &&
        <div className="step" style={{borderColor:'rgba(var(--tint),.25)'}}>
          <div className="row" style={{alignItems:'center', gap:10, flexWrap:'wrap'}}>
            <b style={{fontSize:13}}>지난 작업이 남아 있습니다</b>
            <span className="hint" style={{flex:1, minWidth:180}}>
              {resume.cues.length}큐
              {resume.meta ? ' · ' + resume.meta.split(' —')[0] : ''}
              {resume.mode === 'review' ? ' · 검수' : ' · 번역'}
              {resume.ts ? ' · ' + new Date(resume.ts).toLocaleString('ko-KR') : ''}
              <br />자막을 다시 올리지 않고 그대로 이어서 검수할 수 있습니다.
            </span>
            <button className="primary" onClick={doResume}>이어서 하기</button>
            <button className="sm" onClick={dropResume}>버리기</button>
          </div>
        </div>}

      {screen === 'preview'
        ? <Preview cues={cues} apply={apply} mark={mark} lim={lim} fps={fps} meta={meta} />
        : <>
      {/* 01 파일 */}
      <div className="step">
        <h2>01 — 자막 파일</h2>
          <div id="drop" ref={dropRef}
            onClick={() => document.getElementById('pick').click()}
            onDragOver={(e) => { e.preventDefault(); dropRef.current.classList.add('over'); }}
            onDragLeave={() => dropRef.current.classList.remove('over')}
            onDrop={(e) => { e.preventDefault(); dropRef.current.classList.remove('over');
                             if (e.dataTransfer.files.length) readAll(e.dataTransfer.files); }}>
            <div style={{fontSize:15, fontWeight:600}}>자막 파일을 끌어다 놓으세요 · 여러 개 한꺼번에</div>
            <div className="hint" style={{marginTop:6}}>
              해외 자막(중국어·영어) · 프리미어 텍스트 · 번역 업체 한글본 — 있는 대로 모두 넣으세요<br/>
              SRT · STL · CSV · 프리미어 TXT · UTF-8 / UTF-16 / CP949 자동 판별
            </div>
          </div>
          <input id="pick" type="file" accept=".srt,.stl,.txt,.csv" hidden multiple
                 onChange={(e) => { if (e.target.files.length) readAll(e.target.files); e.target.value=''; }} />

          {files.length > 0 && (
          <div style={{marginTop:14}}>
            <div className="songhead" style={{gridTemplateColumns:'minmax(0,1fr) 92px 150px 40px'}}>
              <div>파일</div><div>언어</div><div>역할</div><div></div>
            </div>
            {files.map((f, i) => (
              <div key={f.name} className="songrow" style={{gridTemplateColumns:'minmax(0,1fr) 92px 150px 40px'}}>
                <div className="ttl" title={f.name}>{f.name}
                  <span style={{color:'var(--dim2)'}}> · {f.info} · {f.cues.length}큐</span></div>
                <div>
                  <select value={f.lang} onChange={e => setFiles(p => p.map((x,k) =>
                    k===i ? {...x, lang:e.target.value} : x))}>
                    <option value="zh">중국어</option><option value="en">영어</option><option value="ko">한국어</option>
                  </select>
                </div>
                <div>
                  <select value={f.role} onChange={e => { const v=e.target.value; setFiles(p => p.map((x,k) =>
                    k===i ? {...x, role:v}
                          : ((v==='source'&&x.role==='source')||(v==='base'&&x.role==='base') ? {...x, role:'ref'} : x))); }}>
                    <option value="source">{mode==='review' ? '검수할 자막' : '번역할 원문'}</option>
                    {mode==='translate' && <option value="base">검수할 번역본</option>}
                    <option value="ref">참고</option>
                  </select>
                </div>
                <div><button className="sm" title="목록에서 빼기"
                  onClick={() => setFiles(p => p.filter((_,k) => k!==i))}>×</button></div>
              </div>
            ))}
            <div className="row" style={{marginTop:14}}>
              <span className="pill">
                {files.some(f=>f.role==='source')
                  ? `원문 ${files.find(f=>f.role==='source').name}`
                    + (files.some(f=>f.role==='base') ? ` · 검수본 ${files.find(f=>f.role==='base').name}` : '')
                    + ` · 참고 ${files.filter(f=>f.role==='ref').length}개`
                  : (mode==='review' ? '검수할 자막을 하나 골라주세요' : '번역할 원문을 하나 골라주세요')}
              </span>
              <span style={{flex:1}} />
              <button onClick={reset}>비우기</button>
              <button className="primary" disabled={!files.some(f=>f.role==='source')}
                onClick={commitFiles}>{mode==='review' ? '검수 시작 →' : '다음 →'}</button>

            {/* 02 전처리 — 자막이 없어도 무엇을 정하는 단계인지 보이게 둔다 */}
      <div className="step">

        <div className="grid g4">

            ? <> · 시작 {s2t(filtered[0].in)} → <b>{s2t(filtered[0].in - zshift)}</b>

        {songs.length > 0 && (
          <div style={{marginTop:14, borderTop:'1px solid rgba(var(--tint),.08)', paddingTop:12}}>

      {/* 03 번역 설정 — 검수 모드에서는 필요 없다 */}
      {mode === 'translate' && (

        {err && <div className="err">{err}</div>}
        </>}
      </div>

              <div className="dh">

          <button disabled={!past.current.length} onClick={undo} title="⌘Z">되돌리기</button>
          <button disabled={!future.current.length} onClick={redo} title="⇧⌘Z">다시 실행</button>
        </div>

        <div className="subf">
          {filter === 'sus' ? (
            <>
              <span className="lb">사유</span>
              {Object.entries(CATS).map(([k, lab]) => (
                <button key={k} type="button"
                  className={'chip t-' + k + (onCat.has(k) ? ' on' : '') + (catCount[k] ? '' : ' z')}
                  onClick={() => setOnCat(p => { const n = new Set(p); n.has(k) ? n.delete(k) : n.add(k); return n; })}>
                  <span className="dot" />{lab}<b>{catCount[k] || 0}</b></button>
              ))}
              {onCat.size > 0 && <button className="sm" onClick={() => setOnCat(new Set())}>해제</button>}
              {ruleQ && <button className="sm" onClick={() => setRuleQ('')}>규칙 필터 «{ruleQ}» 해제</button>}
            </>
          ) : filter === 'edit' ? (
            <>
              <span className="lb">무엇이 바꿨나</span>
              {Object.keys(byCount).length === 0
                ? <span className="msg">아직 고친 큐가 없습니다. 위 단계를 실행하거나 한글 칸을 직접 고쳐 보세요.</span>
                : Object.entries(BYNAME).filter(([k]) => byCount[k]).map(([k, lab]) => (
                    <button key={k} type="button" className={'chip' + (onBy.has(k) ? ' on' : '')}
                      onClick={() => setOnBy(p => { const n = new Set(p); n.has(k) ? n.delete(k) : n.add(k); return n; })}>
                      <span className="dot" />{lab}<b>{byCount[k]}</b></button>
                  ))}
              {onBy.size > 0 && <button className="sm" onClick={() => setOnBy(new Set())}>해제</button>}
            </>
          ) : (
            <span className="msg">갈래로 걸러 보려면 <b>의심</b>을, 무엇이 바뀌었는지 보려면 <b>수정됨</b>을 누르세요.</span>
          )}
        </div>
        {showSpell && cues.some(c => c.spell) && (
          <div className="rulebox">
            <div className="rulehead">
              맞춤법 제안 — <b>{cues.filter(c => c.spell).length}</b>건
              <em> · 타임코드를 눌러 해당 큐로 갑니다. 하나씩 정하거나 아래에서 한꺼번에 처리하세요</em>
            </div>
            <div className="spellbox">
              {cues.map((c, i) => [c, i]).filter(([c]) => c.spell).map(([c, i]) => (
                <div key={i} className="spellrow">
                  <button className="spelltc" title="이 큐로 이동"
                    onClick={() => { setFilter('all'); setRuleQ('');
                      const el = document.getElementById('cue-' + i);
                      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' }); }}>
                    #{i+1}<span>{s2t(c.in).slice(0, 8)}</span></button>
                  <span className="spellwhy">{c.spell.why}</span>
                  <div className="spelltxt">
                    <s>{(c.ko || '').replace(/\n/g, ' / ')}</s>
                    <b>{c.spell.ko.replace(/\n/g, ' / ')}</b>
                  </div>
                  <span className="spellact">
                    <button onClick={() => apply(prev => prev.map((x, k) =>
                      k === i ? mark(x, { ko: x.spell.ko, spell: null }, 'spell') : x))}>적용</button>
                    <button onClick={() => setCues(prev => prev.map((x, k) =>
                      k === i ? { ...x, spell: null } : x))}>넘김</button>
                  </span>
                </div>
              ))}
            </div>
            <div className="row" style={{marginTop:10}}>
              <button className="primary" onClick={() => apply(prev => prev.map(c =>
                c.spell ? mark(c, { ko: c.spell.ko, spell: null }, 'spell') : c))}>
                남은 {cues.filter(c => c.spell).length}건 모두 적용</button>
              <button onClick={() => setCues(prev => prev.map(c =>
                c.spell ? { ...c, spell: null } : c))}>모두 넘김</button>
              <span style={{flex:1}} />
              <button onClick={() => setShowSpell(false)}>패널 닫기</button>
            </div>
          </div>
        )}

        {showRules && (
          <div className="rulebox">
            <div className="rulehead">
              표기 검수 — <b>{ruleStat.total}</b>건
              {!cues.some(c => /<i>/.test(c.en || '')) &&
                <em> · 원문에 기울임 태그가 없어 기울임 항목은 검사되지 않았습니다</em>}
            </div>
            {ruleStat.rows.length === 0
              ? <div className="ruleempty">걸린 항목이 없습니다</div>
              : <div className="rulegrid">
                  {ruleStat.rows.map(([name, n]) => (
                    <button key={name} className="rulechip"
                      onClick={() => { setFilter('sus'); setRuleQ(name === ruleQ ? '' : name); }}
                      style={ruleQ === name ? { borderColor:'var(--sky)', color:'var(--skyInk)' } : undefined}>
                      {name}<span>{n}</span>
                    </button>
                  ))}
                </div>}
            <div className="rulefoot">
              항목을 누르면 해당 큐만 걸러 봅니다. 기울임은 <b>원문에 있으면 옮기고 없으면 새로 넣지 않는</b> 것이 기준입니다.
            </div>
          </div>
        )}
        <p className="hint" style={{marginBottom:8}}>
          한글 칸을 클릭하면 바로 고칠 수 있습니다 (Esc 취소, 포커스 해제 시 저장).
          <code>줄바꿈 2안</code>은 API를 쓰지 않고 즉시, <code>재번역 2안</code>은 그 큐만 다시 번역합니다.
        </p>
        <div className="scroll">
          <table>
            <colgroup>
              <col style={{width:52}} /><col style={{width:98}} />
              {showEn && <col style={{width: refCols.length ? '22%' : '30%'}} />}
              {refCols.map(l => <col key={l} style={{width:`${Math.max(14, 30 - refCols.length*6)}%`}} />)}
              <col /><col style={{width:210}} /><col style={{width:126}} />
            </colgroup>
            <thead><tr>
              <th className="num">#</th><th>타임코드</th>{showEn && <th>{mode === 'review' ? '불러온 자막' : '원문'}</th>}
              {refCols.map(l => <th key={l}>{l}</th>)}
              <th>한글 · 제안</th><th>사유</th><th></th>
            </tr></thead>
            <tbody>
              {view.map(([c, i]) => (
                <MemoRow key={i} c={c} i={i} lim={lim} busy={busy} refCols={refCols}
                  showWas={filter === 'edit'} showEn={showEn}
                  onRevert={() => revertCue(i)}
                  onChange={(v) => setKo(i, v)}
                  onTrack={() => setCues(p => p.map((x, k) =>
                    k === i ? { ...x, track: x.track === 'sub' ? 'main' : 'sub' } : x))}
                  onSuggest={(re) => suggest(i, re)} />
              ))}
            </tbody>
          </table>
        </div>
        </>}
      </div>
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

/* 감싸는 창이 높이를 맞출 수 있도록 알린다. 안 하면 iframe 안에서 또 스크롤되어
   내용이 잘린 것처럼 보인다. */
if (EMBED) {
  let last = 0;
  const tell = () => {
    const h = document.documentElement.scrollHeight;
    if (Math.abs(h - last) > 4) { last = h; parent.postMessage({ sublabHeight: h }, '*'); }
  };
  new ResizeObserver(tell).observe(document.body);
  addEventListener('load', tell);
  setInterval(tell, 700);
}
</script>
</body>
</html>
